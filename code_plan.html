<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>make_a_deal · 实施计划</title>
<style>
:root {
  --brand: #7c5cff;
  --brand-soft: #efeafe;
  --surface: #ffffff;
  --surface-muted: #f5f6fb;
  --text: #1a1a2e;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --accent: #14b8a6;
  --accent-soft: #e6fbf7;
  --neutral-soft: #f0f1f5;
  --font-sans: system-ui, -apple-system, sans-serif;
}
:root[data-widget-theme="dark"] {
  --brand: #9b7cff; --brand-soft: #2a2342;
  --surface: #1e1f2a; --surface-muted: #161720;
  --text: #f3f4f6; --text-muted: #9ca3af;
  --border: #2a2b38; --accent: #2dd4bf; --accent-soft: #1a3a36;
  --neutral-soft: #1f2029;
}
body {
  margin: 0;
  padding: 24px;
  background: var(--surface-muted);
  min-height: 100vh;
  box-sizing: border-box;
  font-family: var(--font-sans);
  color: var(--text);
}
.plan-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; font-family: var(--font-sans); max-width: 800px; margin: 0 auto; }
.plan-title { font-size: 14px; font-weight: 600; color: var(--text); margin: 0 0 4px 0; }
.plan-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 10px 0; }
svg { display: block; width: 100%; height: auto; }
</style>
<script>
  // 跟随系统暗色，独立打开时自动适配
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-widget-theme', 'dark');
  }
</script>
</head>
<body>
<div class="plan-card" data-dynamic-ui-widget data-template="implementation-plan">
  <p class="plan-title">make_a_deal · 实施计划</p>
  <p class="plan-sub">版本路线图 v0.1 → v1.0 · 每版必走 Defender / Attacker / Judge 三角色对抗</p>
  <svg viewBox="0 0 760 380" role="img" aria-label="实施计划版本路线图与三角色对抗循环">
    <defs>
      <marker id="p-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="var(--brand)"/>
      </marker>
      <marker id="p-arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="var(--accent)"/>
      </marker>
    </defs>

    <!-- 上半部：版本路线图 4 阶段卡片 -->
    <text x="20" y="22" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="var(--text)">版本路线图</text>
    <text x="740" y="22" text-anchor="end" font-family="var(--font-sans)" font-size="11" fill="var(--text-muted)">SemVer · 小步快跑</text>

    <!-- 卡1 阶段1 -->
    <rect x="20" y="40" width="160" height="120" rx="10" fill="var(--surface-muted)" stroke="var(--border)"/>
    <text x="100" y="62" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="600" fill="var(--text)">阶段1 · 地基+L1</text>
    <text x="100" y="80" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="600" fill="var(--brand)">v0.1 – v0.2</text>
    <text x="100" y="104" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--text-muted)">数据·约束·骨架</text>
    <line x1="36" y1="120" x2="164" y2="120" stroke="var(--border)"/>
    <text x="100" y="138" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--accent)">前视·对齐·复权</text>
    <text x="100" y="152" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="var(--text-muted)">D→A→J</text>

    <!-- 卡2 阶段2 -->
    <rect x="206" y="40" width="160" height="120" rx="10" fill="var(--surface-muted)" stroke="var(--border)"/>
    <text x="286" y="62" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="600" fill="var(--text)">阶段2 · L2 原语</text>
    <text x="286" y="80" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="600" fill="var(--brand)">v0.3 – v0.6</text>
    <text x="286" y="104" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--text-muted)">回测·因子·风控·增强</text>
    <line x1="222" y1="120" x2="350" y2="120" stroke="var(--border)"/>
    <text x="286" y="138" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--accent)">前视·费用·过拟合</text>
    <text x="286" y="152" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="var(--text-muted)">D→A→J</text>

    <!-- 卡3 阶段3 -->
    <rect x="392" y="40" width="160" height="120" rx="10" fill="var(--brand-soft)" stroke="var(--brand)" stroke-width="1.5"/>
    <text x="472" y="62" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="600" fill="var(--text)">阶段3 · L3 Agent</text>
    <text x="472" y="80" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="600" fill="var(--brand)">v0.7 – v0.8</text>
    <text x="472" y="104" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--text-muted)">闭环·偏差校正·记忆</text>
    <line x1="408" y1="120" x2="536" y2="120" stroke="var(--brand)" stroke-opacity="0.3"/>
    <text x="472" y="138" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--accent)">幻觉·越权·污染</text>
    <text x="472" y="152" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="var(--text-muted)">D→A→J</text>

    <!-- 卡4 阶段4 -->
    <rect x="578" y="40" width="160" height="120" rx="10" fill="var(--surface-muted)" stroke="var(--border)"/>
    <text x="658" y="62" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="600" fill="var(--text)">阶段4 · L4+发布</text>
    <text x="658" y="80" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="600" fill="var(--brand)">v0.9 – v1.0</text>
    <text x="658" y="104" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--text-muted)">沙箱·MCP·端到端</text>
    <line x1="594" y1="120" x2="722" y2="120" stroke="var(--border)"/>
    <text x="658" y="138" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--accent)">逃逸·契约·安全</text>
    <text x="658" y="152" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="var(--text-muted)">D→A→J</text>

    <!-- 阶段推进箭头 -->
    <path d="M180,100 L206,100" fill="none" stroke="var(--brand)" stroke-width="2" marker-end="url(#p-arr)"/>
    <path d="M366,100 L392,100" fill="none" stroke="var(--brand)" stroke-width="2" marker-end="url(#p-arr)"/>
    <path d="M552,100 L578,100" fill="none" stroke="var(--brand)" stroke-width="2" marker-end="url(#p-arr)"/>

    <text x="380" y="180" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--text-muted)">每阶段 = 多个版本 · 每版走完三轮对抗由 Judge 通过 → 打 tag + changelog</text>

    <!-- 下半部：三角色对抗循环 -->
    <text x="20" y="206" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="var(--text)">三角色对抗循环</text>
    <text x="740" y="206" text-anchor="end" font-family="var(--font-sans)" font-size="11" fill="var(--text-muted)">每个 PR / 文件变更必走</text>

    <!-- Defender -->
    <rect x="80" y="226" width="160" height="70" rx="10" fill="var(--brand-soft)" stroke="var(--brand)" stroke-width="1.5"/>
    <text x="160" y="252" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="600" fill="var(--brand)">Defender 防御者</text>
    <text x="160" y="272" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--text)">实施 + 自检</text>
    <text x="160" y="288" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="var(--text-muted)">让方案成立</text>

    <!-- Attacker -->
    <rect x="300" y="226" width="160" height="70" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="380" y="252" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="600" fill="var(--accent)">Attacker 攻击者</text>
    <text x="380" y="272" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--text)">攻击 ≥ 3 问题</text>
    <text x="380" y="288" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="var(--text-muted)">假设方案有缺陷</text>

    <!-- Judge -->
    <rect x="520" y="226" width="160" height="70" rx="10" fill="var(--neutral-soft)" stroke="var(--border)" stroke-width="1.5"/>
    <text x="600" y="252" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="600" fill="var(--text)">Judge 裁判</text>
    <text x="600" y="272" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--text)">裁决通过 / 打回</text>
    <text x="600" y="288" text-anchor="middle" font-family="var(--font-sans)" font-size="9" fill="var(--text-muted)">中立 · 证据裁决</text>

    <!-- D→A→J 箭头 -->
    <path d="M240,261 L300,261" fill="none" stroke="var(--brand)" stroke-width="2" marker-end="url(#p-arr)"/>
    <path d="M460,261 L520,261" fill="none" stroke="var(--brand)" stroke-width="2" marker-end="url(#p-arr)"/>

    <!-- 打回虚线弧 Judge→Defender -->
    <path d="M600,226 C 600,186 160,186 160,226" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#p-arr-acc)"/>
    <text x="380" y="194" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--accent)">打回 · 攻击清单入经验库</text>

    <!-- 通过箭头 向下 -->
    <path d="M600,296 L600,326" fill="none" stroke="var(--brand)" stroke-width="2" marker-end="url(#p-arr)"/>
    <text x="600" y="344" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--brand)">通过 → 升版本 · changelog</text>

    <!-- 底部量化专项攻击清单提示 -->
    <text x="20" y="366" font-family="var(--font-sans)" font-size="10" fill="var(--text-muted)">Attacker 量化专项攻击面：前视偏差 · 幸存者偏差 · 过拟合 · A 股规则遗漏 · 数据对齐 · 费用漏算 · 复权错误 · 财务质量</text>
  </svg>
</div>
</body>
</html>
